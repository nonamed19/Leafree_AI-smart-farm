server.port=9000
server.servlet.context-path=/api
spring.application.name=leafree-backend

# ? JWT
jwt.secret=${JWT_SECRET}

# ? MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/leafree?serverTimezone=Asia/Seoul
spring.datasource.username=k12a402
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# FastAPI
fast-api-baseurl=https://leafree.kr/llm-api

# ? REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ? MQTT
mqtt.broker-url=tcp://leafree.kr:1883
mqtt.client-id=${MQTT_CLIENT_ID}
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}
mqtt.topic-base=/leafree/#

# Access-token lifetime is deliberately configurable; keep secrets only in the environment.
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
